[project]
name = "minns"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dikshacr123", email = "crdiksharaghu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai-whisper>=20250625",
    "opensmile>=2.6.0",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[project.scripts]
minns = "minns:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
